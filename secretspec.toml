[project]
name = "keiri"
require_reason = false
revision = "1.0"

[profiles.default]
API_PORT = { description = "API_PORT secret", required = true }
BETTER_AUTH_BASE_URL = { description = "BETTER_AUTH_BASE_URL secret", required = true }
BETTER_AUTH_SECRET = { description = "BETTER_AUTH_SECRET secret", required = true }
BETTER_AUTH_URL = { description = "BETTER_AUTH_URL secret", required = true }
CLOUDFLARE_ACCOUNT_ID = { description = "CLOUDFLARE_ACCOUNT_ID secret", required = true }
DATABASE_URL = { description = "DATABASE_URL secret", required = true }
DB_ACQUIRE_TIMEOUT_SECS = { description = "DB_ACQUIRE_TIMEOUT_SECS secret", required = true }
GEMINI_MODEL = { description = "GEMINI_MODEL secret", required = true }
GOOGLE_API_KEY = { description = "GOOGLE_API_KEY secret", required = true }
NEXT_PUBLIC_API_BASE_URL = { description = "NEXT_PUBLIC_API_BASE_URL secret", required = true }
OCR_WORKER_URL = { description = "OCR_WORKER_URL secret", required = true }
R2_PUBLIC_URL = { description = "R2_PUBLIC_URL secret", required = true }
RUST_LOG = { description = "RUST_LOG secret", required = true }
S3_ACCESS_KEY_ID = { description = "S3_ACCESS_KEY_ID secret", required = true }
S3_BUCKET_NAME = { description = "S3_BUCKET_NAME secret", required = true }
S3_ENDPOINT = { description = "S3_ENDPOINT secret", required = true }
S3_SECRET_ACCESS_KEY = { description = "S3_SECRET_ACCESS_KEY secret", required = true }
VITE_API_BASE_URL = { description = "VITE_API_BASE_URL secret", required = true }
VITE_AUTH_BASE_URL = { description = "VITE_AUTH_BASE_URL secret", required = true }

[profiles.development.defaults]
providers = ["sops://secrets.yml"]

[profiles.development]
API_PORT = { default = "7878" }
BETTER_AUTH_BASE_URL = { default = "http://localhost:7878" }
BETTER_AUTH_SECRET = { default = "your-secret-at-least-32-chars-long" }
BETTER_AUTH_URL = { default = "http://localhost:7878" }
DB_ACQUIRE_TIMEOUT_SECS = { default = "10" }
RUST_LOG = { default = "info" }
VITE_API_BASE_URL = { default = "http://localhost:7878" }
VITE_AUTH_BASE_URL = { default = "http://localhost:7878" }

[profiles.production.defaults]
providers = ["sops://secrets-prod.yml"]

[profiles.production]
# Inherits all secrets from default profile
