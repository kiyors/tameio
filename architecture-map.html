<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keiri Architecture Map</title>
    <style>
      :root {
        --bg: #0f0f0f;
        --panel: #161616;
        --panel-2: #1c1c1c;
        --border: #2a2a2a;
        --text: #e8e8e8;
        --muted: #8a8a8a;
        --client: #4ea1ff;
        --route: #7bd389;
        --service: #c792ea;
        --db: #ffb86b;
        --external: #ff6b9d;
        --critical: #ff3860;
        --accent: #f5b942;
        --accent-2: #ff7a45;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }
      #controls {
        position: fixed;
        top: 0;
        left: 0;
        right: 320px;
        z-index: 100;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      #controls .chip {
        padding: 5px 14px;
        border-radius: 16px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        transition: all 0.15s;
        user-select: none;
      }
      #controls .chip:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      #controls .chip.active {
        background: var(--accent);
        color: #000;
        border-color: var(--accent);
        font-weight: 600;
      }
      #controls .zoom-btn {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: auto;
      }
      #controls .zoom-btn:first-of-type {
        margin-left: auto;
      }
      #controls .zoom-btn:hover {
        border-color: var(--accent);
      }
      #canvas-wrap {
        position: fixed;
        top: 0;
        left: 0;
        right: 320px;
        bottom: 0;
        overflow: hidden;
        cursor: grab;
      }
      #canvas-wrap.dragging {
        cursor: grabbing;
      }
      svg {
        width: 100%;
        height: 100%;
      }
      #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 320px;
        background: var(--panel);
        border-left: 1px solid var(--border);
        overflow-y: auto;
        padding: 16px;
        z-index: 100;
        font-size: 13px;
        line-height: 1.55;
      }
      #sidebar h2 {
        font-size: 15px;
        color: var(--accent);
        margin-bottom: 8px;
      }
      #sidebar h3 {
        font-size: 13px;
        color: var(--text);
        margin: 12px 0 4px;
      }
      #sidebar .path {
        color: var(--muted);
        font-size: 11px;
        font-family: monospace;
        word-break: break-all;
      }
      #sidebar .role {
        color: var(--text);
        margin: 6px 0;
      }
      #sidebar .plain {
        color: var(--muted);
        font-style: italic;
        margin: 4px 0 8px;
      }
      #sidebar .notes {
        list-style: none;
        padding: 0;
      }
      #sidebar .notes li {
        color: var(--muted);
        font-size: 12px;
        margin: 2px 0;
      }
      #sidebar .notes li::before {
        content: "- ";
        color: var(--accent);
      }
      #sidebar .edge-list {
        margin: 4px 0;
      }
      #sidebar .edge-item {
        font-size: 12px;
        color: var(--muted);
        margin: 2px 0;
      }
      #sidebar .edge-item .label {
        color: var(--text);
      }
      #sidebar .finding {
        margin: 8px 0;
        padding: 8px;
        background: var(--panel-2);
        border-radius: 6px;
        border-left: 3px solid var(--accent);
      }
      #sidebar .finding .title {
        color: var(--accent);
        font-weight: 600;
        font-size: 12px;
      }
      #sidebar .finding .desc {
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
      }
      .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
    </style>
  </head>

        { from: "d-ocr-jobs", to: "e-pg", kind: "db", label: "LISTEN/NOTIFY", tag: ["overview", "ocr", "all"] },

        // Services -> External
        { from: "s-upload", to: "e-r2", kind: "api", label: "aws-sdk-s3", tag: ["overview", "ocr", "all"] },
        {
          from: "s-gemini",
          to: "e-gemini",
          kind: "api",
          label: "generativeLanguage API",
          tag: ["overview", "ocr", "all"],
        },

        // Auth wiring
        {
          from: "auth-session",
          to: "core",
          kind: "normal",
          label: "User context injection",
          tag: ["overview", "auth", "all"],
        },
        {
          from: "core",
          to: "e-betterauth",
          kind: "normal",
          label: "BetterAuth init",
          tag: ["overview", "auth", "all"],
        },
        {
          from: "e-betterauth",
          to: "d-users",
          kind: "db",
          label: "DB read/write (sessions)",
          tag: ["overview", "auth", "all"],
        },
      ];

      const FIXES = {};
      const KNOWN_BUGS = {};

      // ─── COLOR MAP ─────────────────────────────────────────
      const colorMap = {
        client: "#4ea1ff",
        route: "#7bd389",
        service: "#c792ea",
        db: "#ffb86b",
        external: "#ff6b9d",
        entry: "#ff7a45",
      };
      const edgeColors = {
        critical: "#ff3860",
        api: "#ff7a45",
        db: "#ffb86b",
        mount: "#4ea1ff",
        normal: "#555555",
      };

      // ─── STATE ─────────────────────────────────────────────
      let activeFilter = "overview";
      let selectedNode = null;
      let transform = { x: 0, y: 0, s: 1 };
      let dragging = false;
      let dragStart = { x: 0, y: 0 };

      // ─── RENDER ────────────────────────────────────────────
      const svg = document.getElementById("svg");
      const wrap = document.getElementById("canvas-wrap");

      function render() {
        const visibleNodes = new Set();
        const visibleEdges = [];

        nodes.forEach((n) => {
          if (n.tag && n.tag.includes(activeFilter)) visibleNodes.add(n.id);
        });
        edges.forEach((e) => {
          if (e.tag && e.tag.includes(activeFilter)) visibleEdges.push(e);
        });

        // If filtering, also include connected nodes
        if (activeFilter !== "all") {
          visibleEdges.forEach((e) => {
            visibleNodes.add(e.from);
            visibleNodes.add(e.to);
          });
        }

        let html = "";
        html += `<defs>`;
        Object.entries(edgeColors).forEach(([kind, color]) => {
          html += `<marker id="arrow-${kind}" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse"><polygon points="0 0, 10 3.5, 0 7" fill="${color}"/></marker>`;
        });
        html += `</defs>`;

        html += `<g id="world" transform="translate(${transform.x},${transform.y}) scale(${transform.s})">`;

        // Clusters
        clusters.forEach((c) => {
          const fill = c.color + "08";
          const stroke = c.color + "30";
          html += `<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;
          html += `<text x="${c.x + c.w / 2}" y="${c.y + 20}" text-anchor="middle" fill="${c.color}80" font-size="11" font-weight="600" letter-spacing="1">${c.label.toUpperCase()}</text>`;
        });

        // Edges
        visibleEdges.forEach((e) => {
          const from = nodes.find((n) => n.id === e.from);
          const to = nodes.find((n) => n.id === e.to);
          if (!from || !to) return;

          const x1 = from.x + from.w;
          const y1 = from.y + from.h / 2;
          const x2 = to.x;
          const y2 = to.y + to.h / 2;
          const cx1 = x1 + (x2 - x1) * 0.4;
          const cy1 = y1;
          const cx2 = x1 + (x2 - x1) * 0.6;
          const cy2 = y2;

          const color = edgeColors[e.kind] || edgeColors.normal;
          const opacity =
            selectedNode && selectedNode !== e.from && selectedNode !== e.to ? 0.12 : e.kind === "critical" ? 0.9 : 0.5;
          const width = e.kind === "critical" ? 2 : 1.2;

          html += `<path d="M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${width}" opacity="${opacity}" marker-end="url(#arrow-${e.kind})"/>`;

          if (e.label && opacity > 0.12) {
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2 - 6;
            html += `<text x="${mx}" y="${my}" text-anchor="middle" fill="${color}" font-size="8" opacity="0.7">${e.label}</text>`;
          }
        });

        // Nodes
        nodes.forEach((n) => {
          const visible = visibleNodes.has(n.id);
          const opacity = visible ? 1 : 0.15;
          const dimmed =
            selectedNode &&
            selectedNode !== n.id &&
            !edges.some(
              (e) => (e.from === selectedNode && e.to === n.id) || (e.to === selectedNode && e.from === n.id),
            );

          const nodeOpacity = dimmed ? 0.2 : opacity;
          const color = colorMap[n.color] || "#888";
          const strokeW = n.critical ? 2.2 : 1.2;

          html += `<g class="node" data-id="${n.id}" opacity="${nodeOpacity}" style="cursor:pointer">`;
          html += `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="6" fill="#1a1a1a" stroke="${color}" stroke-width="${strokeW}"/>`;
          html += `<text x="${n.x + 10}" y="${n.y + 17}" fill="${color}" font-size="11" font-weight="600">${n.label}</text>`;
          html += `<text x="${n.x + 10}" y="${n.y + 32}" fill="#666" font-size="9">${n.sub}</text>`;

          // Fix/bug badges
          const fixes = FIXES[n.id];
          const bugs = KNOWN_BUGS[n.id];
          if (fixes) {
            html += `<circle cx="${n.x + n.w - 12}" cy="${n.y + 10}" r="8" fill="#22c55e"/>`;
            html += `<text x="${n.x + n.w - 12}" y="${n.y + 14}" text-anchor="middle" fill="#000" font-size="9" font-weight="700">${fixes.length}</text>`;
          }
          if (bugs) {
            const bx = fixes ? n.x + n.w - 30 : n.x + n.w - 12;
            html += `<circle cx="${bx}" cy="${n.y + 10}" r="8" fill="#ff3860"/>`;
            html += `<text x="${bx}" y="${n.y + 14}" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">${bugs.length}</text>`;
          }

          html += `</g>`;
        });

        html += "</g>";
        svg.innerHTML = html;

        // Attach node click/hover listeners
        document.querySelectorAll(".node").forEach((el) => {
          el.addEventListener("click", (ev) => {
            ev.stopPropagation();
            selectedNode = el.dataset.id;
            render();
            renderSidebar(el.dataset.id);
          });
          el.addEventListener("mouseenter", () => {
            if (!selectedNode) renderSidebar(el.dataset.id);
          });
          el.addEventListener("mouseleave", () => {
            if (!selectedNode) renderDefaultSidebar();
          });
        });
      }

      function renderSidebar(nodeId) {
        const n = nodes.find((nd) => nd.id === nodeId);
        if (!n) return;

        const incoming = edges.filter(
          (e) => e.to === nodeId && e.tag && e.tag.includes(activeFilter === "all" ? "all" : activeFilter),
        );
        const outgoing = edges.filter(
          (e) => e.from === nodeId && e.tag && e.tag.includes(activeFilter === "all" ? "all" : activeFilter),
        );

        let html = `<h2>${n.label}</h2>`;
        if (n.path) html += `<div class="path">${n.path}</div>`;
        if (n.role) html += `<div class="role">${n.role}</div>`;
        if (n.plain) html += `<div class="plain">${n.plain}</div>`;

        if (n.notes && n.notes.length) {
          html += `<h3>Notes</h3><ul class="notes">`;
          n.notes.forEach((note) => {
            html += `<li>${note}</li>`;
          });
          html += `</ul>`;
        }

        if (incoming.length) {
          html += `<h3>Incoming (${incoming.length})</h3><div class="edge-list">`;
          incoming.forEach((e) => {
            const src = nodes.find((nd) => nd.id === e.from);
            html += `<div class="edge-item"><span class="label">${src ? src.label : e.from}</span> -> <span style="color:${edgeColors[e.kind]}">${e.label || e.kind}</span></div>`;
          });
          html += `</div>`;
        }

        if (outgoing.length) {
          html += `<h3>Outgoing (${outgoing.length})</h3><div class="edge-list">`;
          outgoing.forEach((e) => {
            const tgt = nodes.find((nd) => nd.id === e.to);
            html += `<div class="edge-item"><span style="color:${edgeColors[e.kind]}">${e.label || e.kind}</span> -> <span class="label">${tgt ? tgt.label : e.to}</span></div>`;
          });
          html += `</div>`;
        }

        const fixes = FIXES[nodeId];
        const bugs = KNOWN_BUGS[nodeId];
        if (fixes) {
          html += `<h3>Fixes (${fixes.length})</h3>`;
          fixes.forEach((f) => {
            html += `<div class="finding"><div class="title">#${f.n}</div><div class="desc">${f.t}</div></div>`;
          });
        }
        if (bugs) {
          html += `<h3>Known Bugs (${bugs.length})</h3>`;
          bugs.forEach((b) => {
            html += `<div class="finding"><div class="title">[${b.sev}]${b.ref ? " " + b.ref : ""}</div><div class="desc">${b.t}</div></div>`;
          });
        }

        document.getElementById("sidebar-content").innerHTML = html;
      }

      function renderDefaultSidebar() {
        let html = `<h2>Keiri Architecture Map</h2>`;
        html += `<div style="color:var(--muted);margin:8px 0">Click a node to inspect it. Use chips above to filter by feature.</div>`;

        html += `<h3>Notable Findings From This Map</h3>`;

        html += `<div class="finding"><div class="title">Heavy Hot Path: Transaction Create</div><div class="desc">Every transaction write triggers atomic wallet rebalancing inside a DB transaction (ops.rs:458). The 18KB ops.rs file is the densest logic concentration in the codebase.</div></div>`;

        html += `<div class="finding"><div class="title">TransactionsManager depends on WalletsManager</div><div class="desc">TransactionsManager takes Arc&lt;WalletsManager&gt; at construction. GroupsManager takes both. This creates a diamond dependency through Core, manageable but worth watching as the crate graph grows.</div></div>`;

        html += `<div class="finding"><div class="title">P2P route delegates to GroupsManager, not a P2P manager</div><div class="desc">The /api/p2p/* routes all delegate to core.groups.* methods (create_p2p_request, accept_p2p_request, etc.), meaning P2P logic lives inside the groups crate despite having its own route file.</div></div>`;

        html += `<div class="finding"><div class="title">OCR Pipeline: 3 Layers Deep</div><div class="desc">Receipt processing flows: OcrManager (pool) -> worker.rs (Tokio task) -> gemini.rs (HTTP) -> services/ocr.rs (DB save). The strategy pattern (GPAY vs GENERIC) adds another dispatch layer.</div></div>`;

        html += `<div class="finding"><div class="title">UserRateLimiter::tracked_count appears unused</div><div class="desc">The tracked_count() method in rate_limit.rs is defined with #[must_use] but has zero callers in the codebase. Likely intended for /metrics but never wired up.</div></div>`;

        html += `<div class="finding"><div class="title">Frontend OPFS Cache: Local-First Architecture</div><div class="desc">The dashboard uses wa-sqlite over OPFS (Origin Private File System) for sub-millisecond local reads. This is an unusual and sophisticated choice that enables offline-first UX with near-instant data rendering.</div></div>`;

        html += `<div class="finding"><div class="title">Auth Stub Surface</div><div class="desc">crates/auth implements OrganizationOps, TwoFactorOps, ApiKeyOps, PasskeyOps as NotImplemented stubs. The users table has two_factor_enabled and the frontend has passkeyClient() - but the backend logic is stubbed out.</div></div>`;

        html += `<h3>Legend</h3>`;
        html += `<div class="legend">`;
        html += `<div class="legend-item"><div class="legend-dot" style="background:#ff3860"></div>Critical path</div>`;
        html += `<div class="legend-item"><div class="legend-dot" style="background:#ff7a45"></div>External API</div>`;
        html += `<div class="legend-item"><div class="legend-dot" style="background:#ffb86b"></div>DB read/write</div>`;
        html += `<div class="legend-item"><div class="legend-dot" style="background:#4ea1ff"></div>Route mount</div>`;
        html += `<div class="legend-item"><div class="legend-dot" style="background:#555555"></div>Internal call</div>`;
        html += `</div>`;

        html += `<h3 style="margin-top:16px">Stats</h3>`;
        html += `<div style="color:var(--muted);font-size:12px">${nodes.length} nodes, ${edges.length} edges<br>6 clusters: Client, Entry, Routes, Services, Data, External</div>`;

        document.getElementById("sidebar-content").innerHTML = html;
      }

      // ─── PAN / ZOOM ────────────────────────────────────────
      wrap.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node")) return;
        dragging = true;
        dragStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
        wrap.classList.add("dragging");
      });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        transform.x = e.clientX - dragStart.x;
        transform.y = e.clientY - dragStart.y;
        const world = document.getElementById("world");
        if (world) world.setAttribute("transform", `translate(${transform.x},${transform.y}) scale(${transform.s})`);
      });
      window.addEventListener("mouseup", () => {
        dragging = false;
        wrap.classList.remove("dragging");
      });

      wrap.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const rect = wrap.getBoundingClientRect();
          const mx = e.clientX - rect.left;
          const my = e.clientY - rect.top;
          const delta = e.deltaY > 0 ? 0.9 : 1.1;
          const ns = Math.max(0.15, Math.min(4, transform.s * delta));
          const ratio = ns / transform.s;
          transform.x = mx - (mx - transform.x) * ratio;
          transform.y = my - (my - transform.y) * ratio;
          transform.s = ns;
          const world = document.getElementById("world");
          if (world) world.setAttribute("transform", `translate(${transform.x},${transform.y}) scale(${transform.s})`);
        },
        { passive: false },
      );

      // Click background to deselect
      wrap.addEventListener("click", (e) => {
        if (!e.target.closest(".node")) {
          selectedNode = null;
          render();
          renderDefaultSidebar();
        }
      });

      // ─── FILTER CHIPS ──────────────────────────────────────
      document.querySelectorAll("#controls .chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          document.querySelectorAll("#controls .chip").forEach((c) => c.classList.remove("active"));
          chip.classList.add("active");
          activeFilter = chip.dataset.filter;
          selectedNode = null;
          render();
          renderDefaultSidebar();
        });
      });

      // ─── ZOOM BUTTONS ──────────────────────────────────────
      document.getElementById("btn-zin").addEventListener("click", () => {
        transform.s = Math.min(4, transform.s * 1.2);
        render();
      });
      document.getElementById("btn-zout").addEventListener("click", () => {
        transform.s = Math.max(0.15, transform.s * 0.8);
        render();
      });
      document.getElementById("btn-fit").addEventListener("click", () => {
        const rect = wrap.getBoundingClientRect();
        const padding = 60;
        const contentW = 1580;
        const contentH = 1040;
        const scaleX = (rect.width - padding * 2) / contentW;
        const scaleY = (rect.height - padding * 2) / contentH;
        transform.s = Math.min(scaleX, scaleY, 1.5);
        transform.x = (rect.width - contentW * transform.s) / 2;
        transform.y = (rect.height - contentH * transform.s) / 2 + 20;
        render();
      });

      // ─── INIT ──────────────────────────────────────────────
      document.getElementById("btn-fit").click();
      renderDefaultSidebar();
    </script>
  </body>
</html>
